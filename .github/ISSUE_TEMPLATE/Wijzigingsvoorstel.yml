name: "BIO-wijzigingsverzoek"
description: "Dank je wel voor het indienen van een BIO-wijzigingsverzoek."
assignees:
  - Annemieke-CIP
  - BartL-CIP
title: "Geef_een_korte_omschrijving_van_het_wijzigingsverzoek"
labels:
  - wijzigingsvoorstel
body:
  - type: input
    id: bio_version
    attributes:
      label: BIO-versie
      description: Noteer het versienummer van de BIO waarop het BIO-wijzigingsverzoek betrekking heeft. De laatste versie is de BIO2 v1.3.
    validations:
      required: true

  - type: dropdown
    id: welk_deel_van_de_BIO
    attributes:
      label: Welk deel van de BIO of het BIO-ontwerp
      description: Bijvoorbeeld de Voortekst waarmee de ongenummerder hoofdstukken worden bedoeld (voorblad, copyright-notitie, wijzigingsbeheer, dankwoord). 
      options:
        - Voortekst
        - Deel 1 BIO2-kader
        - Deel 2 BIO-overheidsmaatregelen
        - BIO-ontwerp
    validations:
      required: true

  - type: input
    id: identificatienummer
    attributes:
      label: Identificatienummer(s)
      description: Noteer het nummer van het hoofdstuk, de paragraaf, de overheidsmaatregel etc., waar het BIO-wijzigingsverzoek betrekking op heeft. Voeg eventueel het regelnummer toe.
      render: text
    validations:
      required: true

  - type: textarea
    id: huidige_tekst
    attributes:
      label: Huidige tekst
      description: Noteer de huidige tekst uit de BIO of uit het BIO-ontwerp.
      render: text
    validations:
      required: true

  - type: textarea
    id: voorgestelde_tekst
    attributes:
      label: Voorgestelde tekst
      description: Noteer de voorgestelde tekst.
      render: text
      validations:
      required: true

  - type: textarea
    id: argumentatie
    attributes:
      label: Argumentatie
      description: Noteer de constatering en argumentatie voor de wijziging, denk aan feitelijke onjuistheden.
      render: text
    validations:
      required: true

  - type: textarea
    id: verwachte_impact
    attributes:
      label: Verwachte impact
      description: Noteer de verwachte positieve en negatieve impact.
      render: text

  - type: textarea
    id: opmerkingen
    attributes:
      label: Opmerkingen
      description: Noteer eventuele opmerkingen of aanvullende informatie zoals een toelichting, links en/of bijlagen.
      render: text

  - type: checkboxes
    id: besluitvraag
    attributes:
      label: Besluitvraag
      description: Deze vraag wordt door de BIO-beheerder ingevuld.
      options:
        - label: Besluitvorming werkgroep BIO en kennisname kern-IBO indien niet impactvol.
        - label: Besluitvorming kern-IBO en OBDO indien impactvol.
        - label: Publicatie op github.com/bio-overheid na besluit.
