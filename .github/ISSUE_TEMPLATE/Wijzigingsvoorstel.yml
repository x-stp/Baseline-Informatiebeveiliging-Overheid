name: "BIO-wijzigingsverzoek"
description: "Dank je wel voor het indienen van een BIO-wijzigingsverzoek."
assignees:
  - Annemieke-CIP
  - BartL-CIP
title: "Geef_een_korte_omschrijving_van_het_wijzigingsverzoek"
labels:
  - wijzigingsvoorstel
body:
  - type: input
    id: bio_version
    attributes:
      label: BIO-versie
      description: Bijvoorbeeld de laatste versie is de BIO2 v1.3.
      placeholder: "Noteer het versienummer van de BIO waarop het wijzigingsverzoek betrekking heeft"
    validations:
      required: true

  - type: dropdown
    id: welk_deel_van_de_BIO
    attributes:
      label: Welk deel van de BIO of het BIO-ontwerp
      description: Bijvoorbeeld de Voortekst waarmee de ongenummerder hoofdstukken worden bedoeld (voorblad, copyright-notitie, wijzigingsbeheer, dankwoord). 
      options:
        - Voortekst
        - Deel 1 BIO2-kader
        - Deel 2 BIO-overheidsmaatregelen
        - BIO-ontwerp
    validations:
      required: true

  - type: input
    id: maatregelen_nummers
    attributes:
      label: Maatregel- en eventueel regelnummer(s)
      placeholder: "Maatregel- en eventueel regelnummer(s)"
    validations:
      required: true

  - type: textarea
    id: huidige_tekst
    attributes:
      label: Huidige tekst
      description: Noteer de huidige tekst uit de BIO of uit het BIO-ontwerp.
      render: text
      placeholder: "Noteer de huidige tekst uit de BIO of uit het BIO-ontwerp"
    validations:
      required: true

  - type: textarea
    id: voorgestelde_tekst
    attributes:
      label: Voorgestelde tekst
      description: Noteer de voorgestelde tekst.
      render: text
      placeholder: "Noteer de voorgestelde tekst"
    validations:
      required: true

  - type: textarea
    id: argumentatie
    attributes:
      label: Argumentatie
      placeholder: "Noteer de constatering en de argumenten."
      render: text
    validations:
      required: true

  - type: textarea
    id: verwachte_impact
    attributes:
      label: Verwachte impact
      placeholder: "Noteer de verwachte positieve en negatieve impact."
      render: text

  - type: textarea
    id: opmerkingen
    attributes:
      label: Opmerkingen
      placeholder: "Noteer eventuele opmerkingen of aanvullende informatie zoals een toelichting, links en/of bijlagen."
      render: text

  - type: checkboxes
    id: besluitvraag
    attributes:
      label: Besluitvraag
      description: Deze vraag wordt door de BIO-beheerder ingevuld.
      options:
        - label: Besluitvorming werkgroep BIO en kennisname kern-IBO indien niet impactvol.
        - label: Besluitvorming kern-IBO en OBDO indien impactvol.
        - label: Publicatie op github.com/bio-overheid na besluit.
